<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake Game</title>
  <style>
    #game-board {
      position: relative;
      width: 400px;
      height: 400px;
      border: 1px solid black;
      overflow: hidden;
    }

    .snake-part {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: green;
    }

    .food {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
    }
  </style>
</head>
<body>
<div id="game-board"></div>
<script src="../js/snake.js"></script>
</body>
</html>
